# Secrets the filestore demo instance pulls into its ${VAR} placeholders via environment
# variables. After the migration these same objects back the valuesFrom references of the
# generated CRs, so they are shared between both halves of the demo.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-demo-secrets
  namespace: keycloak
type: Opaque
stringData:
  CLIENT_SECRET: demo-client-secret-value
  SMTP_PASSWORD: demo-smtp-password
